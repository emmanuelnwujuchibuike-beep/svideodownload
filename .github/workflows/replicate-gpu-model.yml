name: Publish AI Clean model on GPU

# ============================================================================
#  Builds hjunior29/video-text-remover with the GPU enabled and pushes it to
#  Replicate under YOUR account. Run it from the Actions tab — no Docker, no
#  Python, no terminal, nothing installed locally.
# ============================================================================
#
# ── 🔴 REPLICATE USES TWO DIFFERENT TOKENS. THIS COST TWO FAILED RUNS. ──────
#
# Run #2 got all the way to `cog login` and was told:
#
#     "that looks like a Replicate API token, not a CLI auth token.
#      Please fetch a token from https://replicate.com/auth/token to log in"
#
# They are not interchangeable, and the names are close enough to be a trap:
#
#   REPLICATE_API_TOKEN        r8_…  from replicate.com/account/api-tokens
#                              The REST API. Runs predictions. This is the one
#                              the SITE uses, and the one this workflow uses to
#                              look up the account, create the model and read
#                              back the version.
#
#   REPLICATE_CLI_AUTH_TOKEN         from replicate.com/auth/token
#                              The registry. `cog login` and `cog push` only
#                              accept this one.
#
# Both must exist as repository secrets. The workflow checks for each by name
# and says which is missing rather than failing at the registry.
#
# ── WHY THIS EXISTS ─────────────────────────────────────────────────────────
#
# The model AI Clean calls is published on CPU hardware. Measured 2026-09-08: a
# 0.15 MB clip ran over ten minutes against a published typical of 124 seconds,
# and three jobs in a row were abandoned. Its own README says "GPU is
# auto-detected and used if available (3-6x faster)" — the CUDA path is written
# and dormant, because upstream ships `gpu: false` and the CPU build of ONNX
# Runtime.
#
# Republishing the MIT-licensed code on GPU normally means `cog push`, which
# needs Docker — and the owner's machine has no Docker, no cog and no Python.
# A GitHub runner has all of it, and this repository is PUBLIC so the minutes
# are free.
#
# ── SETUP (two secrets, then a button) ──────────────────────────────────────
#
#   Repo → Settings → Secrets and variables → Actions → New repository secret
#
#     REPLICATE_API_TOKEN        ← https://replicate.com/account/api-tokens
#     REPLICATE_CLI_AUTH_TOKEN   ← https://replicate.com/auth/token
#
#   Then: Actions → this workflow → Run workflow → leave every field blank.
#
#   The model is created for you if it does not exist, on Nvidia T4, and the
#   username is read from the token. There is no form to fill in correctly.
#
#   When it finishes, the run Summary prints two environment variables. Put
#   BOTH into Vercel (frenzsave → Settings → Environment Variables) and
#   redeploy:
#
#     REPLICATE_AI_CLEAN_MODEL          = <username>/video-text-remover-gpu
#     REPLICATE_AI_CLEAN_MODEL_VERSION  = <the 64-char hash>
#
#   Set them TOGETHER. A new owner/name with the old hash resolves to nothing.
#   Clearing both rolls back to the committed defaults in lib/ai/config.ts.
#
# ── ⚠️ T4, NOT SOMETHING BIGGER ─────────────────────────────────────────────
#
# T4 is $0.000225/sec against CPU's $0.000100 — 2.25x per second, but at several
# times fewer seconds it lands CHEAPER per job as well as much faster. This is a
# YOLOv8 detector, not a diffusion model; an L40S or A100 costs 4-6x more per
# second and cannot use the extra silicon.
#
# ── ⚠️ THIS IS NOT A VERCEL DEPLOY ──────────────────────────────────────────
#
# A Vercel project named `replicate-gpu` was created against this repo and fails
# on every push. It always will: `docs/replicate-gpu/` is a model definition —
# no package.json, nothing for Vercel to build. Delete that project.

on:
  # 🔴 MANUAL ONLY. A CUDA build is ~15 minutes of a runner and pushes a
  # multi-gigabyte layer to a third party. That is a decision somebody makes,
  # never something a `git push` triggers by accident.
  workflow_dispatch:
    inputs:
      replicate_owner:
        description: "Replicate username — LEAVE BLANK to use the token's own account"
        required: false
        type: string
      model_name:
        description: "Model name (created automatically if it does not exist)"
        required: true
        default: "video-text-remover-gpu"
        type: string
      cuda_version:
        description: "CUDA version (12.1 matches onnxruntime-gpu 1.20)"
        required: true
        default: "12.1"
        type: string

concurrency:
  group: replicate-gpu-model
  cancel-in-progress: false

jobs:
  push:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      # ── 🔴 BOTH SECRETS, BY NAME, BEFORE ANYTHING IS SPENT ────────────────
      #
      # Run #2 spent four minutes freeing disk and building before discovering
      # the wrong token was configured. Checking both here costs a second, and
      # the message says WHICH one is missing and WHERE to get it — the two
      # names are close enough that "the token is wrong" is not useful advice.
      - name: Check both tokens are configured
        env:
          API_TOKEN: ${{ secrets.REPLICATE_API_TOKEN }}
          CLI_TOKEN: ${{ secrets.REPLICATE_CLI_AUTH_TOKEN }}
        run: |
          set -euo pipefail
          missing=0
          if [ -z "${API_TOKEN:-}" ]; then
            echo "::error::REPLICATE_API_TOKEN is not set. Get it from https://replicate.com/account/api-tokens (starts r8_)."
            missing=1
          fi
          if [ -z "${CLI_TOKEN:-}" ]; then
            echo "::error::REPLICATE_CLI_AUTH_TOKEN is not set. This is a DIFFERENT token — get it from https://replicate.com/auth/token"
            missing=1
          fi
          [ "$missing" = "0" ] || exit 1
          echo "both tokens present"

      - name: Verify the API token and resolve the account
        id: account
        env:
          REPLICATE_API_TOKEN: ${{ secrets.REPLICATE_API_TOKEN }}
          OWNER_INPUT: ${{ inputs.replicate_owner }}
        run: |
          set -euo pipefail

          # A pasted secret very often carries a trailing newline or space. It
          # is invisible in the GitHub UI and it 401s every request.
          raw_len=$(printf '%s' "$REPLICATE_API_TOKEN" | wc -c)
          token="$(printf '%s' "$REPLICATE_API_TOKEN" | tr -d '[:space:]')"
          if [ "${#token}" -ne "$raw_len" ]; then
            echo "::warning::REPLICATE_API_TOKEN contained whitespace; trimmed before use"
          fi
          case "$token" in
            r8_*) : ;;
            *) echo "::warning::REPLICATE_API_TOKEN does not start with r8_ — did the two tokens get swapped?" ;;
          esac

          code=$(curl -sS -o /tmp/account.json -w '%{http_code}' \
            -H "Authorization: Bearer ${token}" https://api.replicate.com/v1/account)
          if [ "$code" != "200" ]; then
            echo "::error::Replicate rejected REPLICATE_API_TOKEN (HTTP $code). Mint a fresh one at https://replicate.com/account/api-tokens"
            cat /tmp/account.json
            exit 1
          fi

          resolved=$(python3 -c "import json;print(json.load(open('/tmp/account.json')).get('username',''))")
          [ -n "$resolved" ] || { echo "::error::token valid but the account has no username"; cat /tmp/account.json; exit 1; }

          owner="${OWNER_INPUT:-}"
          [ -z "$owner" ] && owner="$resolved"
          echo "authenticated as: $resolved"
          echo "publishing under: $owner"

          # 🔴 THE TOKEN IS NOT AN OUTPUT. Step outputs are ordinary workflow
          # context, not secrets: unmasked, present under debug logging, and
          # printed by anything that dumps the context. Only the OWNER crosses
          # steps; every step needing a token re-reads the SECRET, which GitHub
          # does mask.
          echo "owner=$owner" >> "$GITHUB_OUTPUT"

      # `cog push` uploads TO a model and does not create one. Leaving that
      # manual means forgetting it fails at the END of a fifteen-minute build.
      - name: Ensure the model exists
        env:
          REPLICATE_API_TOKEN: ${{ secrets.REPLICATE_API_TOKEN }}
          OWNER: ${{ steps.account.outputs.owner }}
          NAME: ${{ inputs.model_name }}
        run: |
          set -euo pipefail
          TOKEN="$(printf '%s' "$REPLICATE_API_TOKEN" | tr -d '[:space:]')"

          code=$(curl -sS -o /tmp/model.json -w '%{http_code}' \
            -H "Authorization: Bearer ${TOKEN}" \
            "https://api.replicate.com/v1/models/${OWNER}/${NAME}")
          if [ "$code" = "200" ]; then
            echo "model ${OWNER}/${NAME} already exists"
            exit 0
          fi

          echo "creating ${OWNER}/${NAME} on Nvidia T4…"
          code=$(curl -sS -o /tmp/create.json -w '%{http_code}' -X POST \
            -H "Authorization: Bearer ${TOKEN}" \
            -H "Content-Type: application/json" \
            https://api.replicate.com/v1/models \
            -d "{\"owner\":\"${OWNER}\",\"name\":\"${NAME}\",\"visibility\":\"private\",\"hardware\":\"gpu-t4\",\"description\":\"video-text-remover on GPU, for Frenzsave AI Clean\"}")

          # 409 = it appeared between the two calls. Not an error.
          if [ "$code" != "201" ] && [ "$code" != "409" ]; then
            echo "::error::could not create the model (HTTP $code)"
            cat /tmp/create.json
            exit 1
          fi
          echo "model ready"

      # Replicate's own recommendation for this build. A CUDA base image is
      # several gigabytes and a stock runner has little room to spare.
      - name: Free disk space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false
          docker-images: false

      - name: Check out our overrides
        uses: actions/checkout@v4
        with:
          path: frenzsave
          sparse-checkout: docs/replicate-gpu

      - name: Clone the upstream model (MIT)
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/hjunior29/video-text-remover.git model
          echo "── upstream cog.yaml ──"
          cat model/cog.yaml

      - name: Apply the GPU overrides
        env:
          OWNER: ${{ steps.account.outputs.owner }}
          NAME: ${{ inputs.model_name }}
          CUDA: ${{ inputs.cuda_version }}
        run: |
          set -euo pipefail
          cp frenzsave/docs/replicate-gpu/cog.yaml         model/cog.yaml
          cp frenzsave/docs/replicate-gpu/requirements.txt model/requirements.txt

          sed -i "s|r8.im/YOUR-REPLICATE-USERNAME/video-text-remover-gpu|r8.im/${OWNER}/${NAME}|" model/cog.yaml
          sed -i "s|^  cuda: .*|  cuda: \"${CUDA}\"|" model/cog.yaml

          echo "── patched cog.yaml ──"
          cat model/cog.yaml
          echo "── patched requirements.txt ──"
          cat model/requirements.txt

          # 🔴 Ship both changes or neither. A GPU container that cannot address
          # its GPU runs at CPU speed and bills 2.25x/second for it, and nothing
          # looks wrong — so both are asserted rather than trusted.
          grep -q "gpu: true" model/cog.yaml \
            || { echo "::error::cog.yaml does not enable the GPU"; exit 1; }
          grep -q "onnxruntime-gpu" model/requirements.txt \
            || { echo "::error::requirements.txt still pins the CPU build of ONNX Runtime"; exit 1; }
          if grep -q "^onnxruntime==" model/requirements.txt; then
            echo "::error::both ONNX Runtime builds present — they provide the same module and the CPU wheel can win silently"
            exit 1
          fi
          if grep -q "YOUR-REPLICATE-USERNAME" model/cog.yaml; then
            echo "::error::the image placeholder was not replaced — owner resolved empty?"
            exit 1
          fi

      # ── 🔴 DO THE PINNED VERSIONS ACTUALLY EXIST? ─────────────────────────
      #
      # Run #3 spent two minutes reaching `pip install` before learning that
      # `onnxruntime-gpu==1.20.1` does not exist — the GPU package skips 1.20.1
      # entirely, which the CPU package it was copied from does not.
      #
      # PyPI can answer that in one request per package, before Docker starts.
      # A pin that cannot resolve is a typo-class mistake and deserves a
      # typo-class turnaround, not a build.
      - name: Check every pin resolves on PyPI
        run: |
          set -euo pipefail
          fail=0
          while IFS= read -r line; do
            case "$line" in ""|\#*) continue ;; esac
            case "$line" in *==*) : ;; *) continue ;; esac

            pkg="${line%%==*}"
            ver="${line##*==}"
            # Strip anything after the version (markers, comments).
            ver="${ver%% *}"

            code=$(curl -sS -o /dev/null -w '%{http_code}' \
              "https://pypi.org/pypi/${pkg}/${ver}/json")
            if [ "$code" = "200" ]; then
              echo "  ✅ ${pkg}==${ver}"
            else
              fail=1
              echo "  🔴 ${pkg}==${ver} does not exist on PyPI (HTTP ${code})"
              avail=$(curl -sS "https://pypi.org/pypi/${pkg}/json" \
                | python3 -c "import sys,json; print(', '.join(sorted(json.load(sys.stdin)['releases'])[-12:]))" 2>/dev/null || true)
              [ -n "$avail" ] && echo "     recent versions: ${avail}"
            fi
          done < model/requirements.txt

          if [ "$fail" != "0" ]; then
            echo "::error::one or more pinned versions do not exist — fix docs/replicate-gpu/requirements.txt"
            exit 1
          fi
          echo "every pin resolves"

      # ── 🔴 REPLICATE'S OWN ACTION, NOT A HAND-ROLLED INSTALL ──────────────
      #
      # The first two attempts curl'd the cog binary and ran `cog login`
      # manually, and got the token distinction wrong. This is the path
      # Replicate documents and maintains: it installs cog AND authenticates,
      # and it takes the CLI auth token, which is the one the registry accepts.
      - name: Set up Cog
        uses: replicate/setup-cog@v2
        with:
          token: ${{ secrets.REPLICATE_CLI_AUTH_TOKEN }}

      - name: Build and push
        working-directory: model
        env:
          OWNER: ${{ steps.account.outputs.owner }}
          NAME: ${{ inputs.model_name }}
        run: |
          set -euo pipefail
          echo "pushing to r8.im/${OWNER}/${NAME} — the first build is slow (CUDA image); later ones are cached"
          cog push "r8.im/${OWNER}/${NAME}"

      - name: Report the version to pin
        env:
          REPLICATE_API_TOKEN: ${{ secrets.REPLICATE_API_TOKEN }}
          OWNER: ${{ steps.account.outputs.owner }}
          NAME: ${{ inputs.model_name }}
        run: |
          set -euo pipefail
          TOKEN="$(printf '%s' "$REPLICATE_API_TOKEN" | tr -d '[:space:]')"

          version=$(curl -sS -H "Authorization: Bearer ${TOKEN}" \
            "https://api.replicate.com/v1/models/${OWNER}/${NAME}/versions" \
            | python3 -c "import sys,json; r=json.load(sys.stdin)['results']; print(r[0]['id'] if r else '')")

          if [ -z "$version" ]; then
            echo "::error::pushed, but no version came back — check the model page on Replicate"
            exit 1
          fi

          {
            echo "## Model published ✅"
            echo ""
            echo "Set BOTH of these in Vercel (frenzsave → Settings → Environment Variables), then redeploy:"
            echo ""
            echo '```'
            echo "REPLICATE_AI_CLEAN_MODEL=${OWNER}/${NAME}"
            echo "REPLICATE_AI_CLEAN_MODEL_VERSION=${version}"
            echo '```'
            echo ""
            echo "⚠️ Set them together. A new owner/name with the old hash resolves to nothing."
            echo ""
            echo "### Then confirm the GPU is actually being used"
            echo ""
            echo "Run one prediction from the model's page and open its **Logs**. You want a line"
            echo "mentioning \`CUDAExecutionProvider\`. \`CPUExecutionProvider\` alone means the GPU is"
            echo "present but unaddressable — you would pay 2.25x/second for CPU speed and nothing"
            echo "would look wrong."
          } >> "$GITHUB_STEP_SUMMARY"

          echo "model:   ${OWNER}/${NAME}"
          echo "version: ${version}"
