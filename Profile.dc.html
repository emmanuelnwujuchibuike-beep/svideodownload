<x-dc>

<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1480}}'>
class Component extends DCLogic {
renderVals() {
const bgs = [
'linear-gradient(160deg, #3A3550, #1C1A2B)',
'linear-gradient(160deg, #7A2E3A, #2B1218)',
'linear-gradient(160deg, #3D7FBF, #1D3B5C)',
'linear-gradient(160deg, #4B3FA8, #1A1446)',

'linear-gradient(160deg, #8A3FB0, #2A1240)',
