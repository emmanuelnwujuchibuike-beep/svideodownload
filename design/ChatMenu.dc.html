<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Chat options</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&amp;family=Hanken+Grotesk:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#FFFFFF}
a{color:#3D5AFE}a:hover{color:#7B3FE4}
</style>
</helmet>
<div style="width: 390px; height: 1080px; box-sizing: border-box; position: relative; overflow: hidden; background: radial-gradient(90% 50% at 20% 10%, #C23FD1, rgba(194,63,209,0) 60%), radial-gradient(80% 50% at 90% 40%, #3D5AFE, rgba(61,90,254,0) 60%), radial-gradient(100% 60% at 50% 100%, #7B3FE4, rgba(123,63,228,0) 65%), #140C3A; font-family: 'Hanken Grotesk', sans-serif; color: #12111A">

<div style="position: absolute; top: 70px; right: 16px; max-width: 60%; padding: 10px 14px; border-radius: 20px 20px 6px 20px; background: rgba(255,255,255,0.35); font-size: 15px; color: #FFFFFF" aria-hidden="true">How Ur area na</div>
<div style="position: absolute; top: 118px; left: 16px; max-width: 60%; padding: 10px 14px; border-radius: 20px 20px 20px 6px; background: rgba(255,255,255,0.25); font-size: 15px; color: #FFFFFF" aria-hidden="true">Replied to your story 😍</div>
<div style="position: absolute; inset: 0; background: rgba(10,6,30,0.25)" aria-hidden="true"></div>

<section role="dialog" aria-label="Chat options" style="position: absolute; left: 0; right: 0; top: 40px; bottom: 0; border-radius: 34px 34px 0 0; background: rgba(250,249,255,0.78); border-top: 1px solid rgba(255,255,255,0.8); backdrop-filter: blur(40px) saturate(180%); -webkit-backdrop-filter: blur(40px) saturate(180%); box-shadow: 0 -20px 60px rgba(10,6,30,0.35), inset 0 1px 0 rgba(255,255,255,0.9); display: flex; flex-direction: column">
<div style="width: 36px; height: 5px; margin: 8px auto 0 auto; border-radius: 3px; background: rgba(60,50,100,0.25)" aria-hidden="true"></div>

<div style="display: flex; justify-content: flex-end; padding: 6px 14px 0 14px">
<button aria-label="Close" style="width: 34px; height: 34px; border-radius: 50%; border: 1px solid rgba(255,255,255,0.9); background: rgba(255,255,255,0.6); color: #4A4760; display: flex; align-items: center; justify-content: center">
<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12"></path><path d="M18 6L6 18"></path></svg>
</button>
</div>

<div style="display: flex; flex-direction: column; align-items: center; gap: 4px; margin-top: -8px">
<span style="width: 84px; height: 84px; border-radius: 50%; padding: 3px; box-sizing: border-box; background: linear-gradient(135deg, #3D5AFE, #7B3FE4 55%, #C23FD1); box-shadow: 0 14px 30px -10px rgba(91,63,240,0.55); display: flex">
<span style="flex: 1; border-radius: 50%; border: 3px solid #FFFFFF; background: #FFFFFF; display: flex; align-items: center; justify-content: center">
<span style="font-family: Sora, sans-serif; font-weight: 800; font-size: 34px; background: linear-gradient(135deg, #3D5AFE, #7B3FE4 55%, #C23FD1); -webkit-background-clip: text; background-clip: text; color: transparent">F</span>
</span>
</span>
<span style="display: flex; align-items: center; gap: 6px; margin-top: 6px">
<span style="font-family: Sora, sans-serif; font-weight: 800; font-size: 22px; letter-spacing: -0.5px">Frenz</span>
<svg width="18" height="18" viewBox="0 0 24 24" role="img" aria-label="Verified"><path d="M12 2l2.4 1.8 3-.2.9 2.9 2.5 1.7-1 2.8 1 2.8-2.5 1.7-.9 2.9-3-.2L12 22l-2.4-1.8-3 .2-.9-2.9-2.5-1.7 1-2.8-1-2.8 2.5-1.7.9-2.9 3 .2z" fill="#3D5AFE"></path><path d="M8 12.2l2.6 2.6L16 9.4" fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"></path></svg>
</span>
<span style="font-size: 14px; color: #5A5770">@frenz · Last seen 7m ago</span>
<a href="#" style="margin-top: 6px; height: 34px; padding: 0 14px; border-radius: 17px; background: rgba(255,255,255,0.7); border: 1px solid rgba(255,255,255,0.95); font-size: 13px; font-weight: 700; color: #3D2BB8; text-decoration: none; display: flex; align-items: center">View profile</a>
</div>


<button style="margin: 16px 16px 0 16px; height: 56px; padding: 0 8px 0 14px; border-radius: 18px; border: none; background: linear-gradient(90deg, #3D5AFE, #7B3FE4 60%, #C23FD1); box-shadow: 0 14px 28px -12px rgba(91,63,240,0.7), inset 0 1px 0 rgba(255,255,255,0.3); display: flex; align-items: center; gap: 12px; font-family: 'Hanken Grotesk', sans-serif; text-align: left; color: #FFFFFF">
<span style="width: 38px; height: 38px; flex: none; border-radius: 12px; background: rgba(255,255,255,0.2); display: flex; align-items: center; justify-content: center" aria-hidden="true">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.8 4.7L18.5 9.5l-4.7 1.8L12 16l-1.8-4.7L5.5 9.5l4.7-1.8z"></path><path d="M19 15l.8 2.2L22 18l-2.2.8L19 21l-.8-2.2L16 18l2.2-.8z"></path></svg>
</span>
<span style="flex: 1; display: flex; flex-direction: column; gap: 1px">
<span style="font-family: Sora, sans-serif; font-weight: 700; font-size: 16px">Send AI credits</span>
<span style="font-size: 12px; font-weight: 600; color: rgba(255,255,255,0.85)">Gift credits to Frenz</span>
</span>
<span style="height: 30px; padding: 0 10px; border-radius: 15px; background: rgba(255,255,255,0.22); font-size: 12px; font-weight: 700; display: flex; align-items: center">Your balance: [#]</span>
</button>

<div style="margin: 14px 16px 0 16px; padding: 14px; border-radius: 22px; background: rgba(255,255,255,0.66); border: 1px solid rgba(255,255,255,0.95); display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; align-items: center; justify-content: space-between">
<span style="font-size: 15px; font-weight: 700">Theme</span>
<span style="font-size: 13px; font-weight: 600; color: #5A5770">Frenz</span>
</div>
<div role="radiogroup" aria-label="Chat theme" style="display: flex; justify-content: space-between">
<sc-for list="{{themes}}" as="t" hint-placeholder-count="6">
<button role="radio" aria-checked="{{t.checked}}" aria-label="{{t.name}} theme" style="width: 46px; height: 46px; border-radius: 50%; padding: 3px; box-sizing: border-box; border: 2.5px solid {{t.ring}}; background: transparent; display: flex">
<span style="flex: 1; border-radius: 50%; background: {{t.fill}}; box-shadow: inset 0 1px 0 rgba(255,255,255,0.4); display: flex; align-items: center; justify-content: center; color: #FFFFFF">
<sc-if value="{{t.selected}}" hint-placeholder-val="{{ false }}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg></sc-if>
</span>
</button>
</sc-for>
</div>
</div>

<div style="margin: 10px 16px 0 16px; padding: 14px; border-radius: 22px; background: rgba(255,255,255,0.66); border: 1px solid rgba(255,255,255,0.95); display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; align-items: center; justify-content: space-between">
<span style="font-size: 15px; font-weight: 700">Wallpaper</span>
<div role="radiogroup" aria-label="Who sees the wallpaper" style="padding: 3px; border-radius: 10px; background: rgba(120,110,160,0.14); display: flex; gap: 2px">
<button role="radio" aria-checked="true" style="height: 28px; padding: 0 10px; border-radius: 8px; border: none; background: #FFFFFF; box-shadow: 0 1px 3px rgba(30,20,80,0.18); font-family: 'Hanken Grotesk', sans-serif; font-size: 12px; font-weight: 700; color: #12111A">Both of you</button>
<button role="radio" aria-checked="false" style="height: 28px; padding: 0 10px; border-radius: 8px; border: none; background: transparent; font-family: 'Hanken Grotesk', sans-serif; font-size: 12px; font-weight: 600; color: #3E3B52">Only you</button>
</div>
</div>
<div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px">
<button aria-label="Upload wallpaper" style="height: 92px; border-radius: 14px; border: 1.5px dashed #B9B0E6; background: rgba(255,255,255,0.5); color: #3D2BB8; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-family: 'Hanken Grotesk', sans-serif; font-size: 11px; font-weight: 700">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14"></path><path d="M5 12h14"></path></svg>
Upload</button>
<button aria-label="Wallpaper: Aurora, selected" style="position: relative; height: 92px; border-radius: 14px; border: 2.5px solid #5B3FD8; background: radial-gradient(circle at 30% 20%, #C23FD1, #7B3FE4 45%, #1E1460); padding: 0">
<span style="position: absolute; right: 5px; bottom: 5px; width: 18px; height: 18px; border-radius: 50%; background: #FFFFFF; color: #5B3FD8; display: flex; align-items: center; justify-content: center"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg></span>
</button>
<button aria-label="Wallpaper: Midnight" style="height: 92px; border-radius: 14px; border: 1px solid rgba(255,255,255,0.9); background: radial-gradient(circle at 60% 70%, #3D5AFE, #13206E 55%, #050818); padding: 0"></button>
<button aria-label="Wallpaper: Plain" style="height: 92px; border-radius: 14px; border: 1px solid #E2DEF2; background: #F3F2F9; padding: 0"></button>
</div>
</div>

<div style="margin: 10px 16px 0 16px; border-radius: 22px; background: rgba(255,255,255,0.66); border: 1px solid rgba(255,255,255,0.95); overflow: hidden">
<sc-for list="{{rows}}" as="r" hint-placeholder-count="4">
<a href="#" style="display: flex; align-items: center; gap: 12px; height: 54px; padding: 0 14px; border-top: {{r.divider}}; text-decoration: none; color: #12111A">
<span style="width: 30px; height: 30px; flex: none; border-radius: 9px; background: {{r.tint}}; color: #FFFFFF; display: flex; align-items: center; justify-content: center" aria-hidden="true">
<sc-if value="{{r.ic.timer}}" hint-placeholder-val="{{ false }}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="13" r="8"></circle><path d="M12 9v4l2.5 2"></path><path d="M9 2h6"></path></svg></sc-if>
<sc-if value="{{r.ic.font}}" hint-placeholder-val="{{ false }}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20l6-16 6 16"></path><path d="M6.5 14h7"></path><path d="M17 20v-6a2.5 2.5 0 0 1 5 0v6"></path></svg></sc-if>
<sc-if value="{{r.ic.media}}" hint-placeholder-val="{{ false }}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="3"></rect><circle cx="9" cy="10" r="2"></circle><path d="M21 16l-5-5-9 9"></path></svg></sc-if>
<sc-if value="{{r.ic.search}}" hint-placeholder-val="{{ false }}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-4-4"></path></svg></sc-if>
</span>
<span style="flex: 1; font-size: 16px; font-weight: 600">{{r.title}}</span>
<span style="font-size: 14px; color: #6E6A85">{{r.value}}</span>
<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#8A879C" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>
</a>
</sc-for>
</div>

<div style="margin: 10px 16px 0 16px; border-radius: 22px; background: rgba(255,255,255,0.66); border: 1px solid rgba(255,255,255,0.95); overflow: hidden">
<button style="width: 100%; height: 52px; display: flex; align-items: center; gap: 12px; padding: 0 14px; border: none; background: transparent; font-family: 'Hanken Grotesk', sans-serif; font-size: 16px; font-weight: 600; color: #B4233F; text-align: left">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M5.6 5.6l12.8 12.8"></path></svg>
Block or restrict</button>
<button style="width: 100%; height: 52px; display: flex; align-items: center; gap: 12px; padding: 0 14px; border: none; border-top: 1px solid rgba(120,110,160,0.16); background: transparent; font-family: 'Hanken Grotesk', sans-serif; font-size: 16px; font-weight: 600; color: #B4233F; text-align: left">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 21V4"></path><path d="M5 4h11l-2 4 2 4H5"></path></svg>
Report</button>
</div>
</section>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1080}}'>
class Component extends DCLogic {
renderVals() {
const themes = [
{ name: 'Frenz', fill: 'linear-gradient(135deg, #3D5AFE, #7B3FE4 55%, #C23FD1)', selected: true },
{ name: 'Blue', fill: '#3D5AFE' },
{ name: 'Violet', fill: '#7B3FE4' },
{ name: 'Magenta', fill: '#C23FD1' },
{ name: 'Midnight', fill: 'linear-gradient(135deg, #2A1E78, #0E0B1F)' },
{ name: 'Mono', fill: '#12111A' }
].map((t) => ({ ...t, selected: !!t.selected, checked: t.selected ? 'true' : 'false', ring: t.selected ? '#5B3FD8' : 'transparent' }));
const rows = [
{ title: 'Disappearing messages', value: 'Off', ic: { timer: true }, tint: '#3D5AFE' },
{ title: 'Font & bubble style', value: '', ic: { font: true }, tint: '#7B3FE4' },
{ title: 'Media, links & files', value: '', ic: { media: true }, tint: '#C23FD1' },
{ title: 'Search in chat', value: '', ic: { search: true }, tint: '#12111A' }
].map((r, i) => ({ ...r, divider: i === 0 ? 'none' : '1px solid rgba(120,110,160,0.16)' }));
return {
themes,
rows
};
}
}
</script>
</body>
</html>
