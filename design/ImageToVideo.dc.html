<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Image to Video</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&amp;family=Hanken+Grotesk:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#FFFFFF}
a{color:#3D5AFE}a:hover{color:#7B3FE4}
textarea::placeholder{color:#8A879C}
</style>
</helmet>
<div style="width: 390px; height: 1360px; box-sizing: border-box; position: relative; overflow: hidden; background: #FFFFFF; font-family: 'Hanken Grotesk', sans-serif; color: #12111A">

<header style="display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; padding: 12px 16px 0 8px">
<a href="AIExplore.dc.html" style="justify-self: start; height: 44px; display: flex; align-items: center; gap: 2px; padding: 0 8px; font-size: 16px; font-weight: 600; color: #3D2BB8; text-decoration: none">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>
Studio</a>
<span style="font-family: Sora, sans-serif; font-weight: 700; font-size: 17px">Image to Video</span>
<a href="#" aria-label="12 AI credits — view or earn" style="justify-self: end; display: flex; align-items: center; gap: 6px; height: 34px; padding: 0 12px; border-radius: 17px; background: #F1F0F6; text-decoration: none; color: #12111A; font-size: 14px; font-weight: 800">
<svg width="14" height="14" viewBox="0 0 24 24" fill="#7B3FE4" aria-hidden="true"><path d="M12 2l2.2 6.1L20.5 10l-6.3 1.9L12 18l-2.2-6.1L3.5 10l6.3-1.9z"></path></svg>
12</a>
</header>

<div style="padding: 18px 20px 0 20px">
<h1 style="margin: 0; font-family: Sora, sans-serif; font-weight: 800; font-size: 28px; letter-spacing: -1px; line-height: 1.1">Your photo.<br><span style="background: linear-gradient(90deg, #3D5AFE, #7B3FE4 55%, #C23FD1); -webkit-background-clip: text; background-clip: text; color: transparent">Now in motion.</span></h1>
</div>

<div style="margin: 16px 16px 0 16px; display: flex; flex-direction: column; gap: 8px">
<button aria-label="Choose a photo" style="position: relative; height: 230px; border-radius: 24px; border: 1.5px dashed #C9C0EE; background: radial-gradient(120% 90% at 50% 0%, #F1EDFF, #FAF9FE 70%); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; font-family: 'Hanken Grotesk', sans-serif">
<span style="width: 60px; height: 60px; border-radius: 18px; background: linear-gradient(135deg, #3D5AFE, #7B3FE4 55%, #C23FD1); box-shadow: 0 14px 28px -12px rgba(91,63,240,0.7); color: #FFFFFF; display: flex; align-items: center; justify-content: center" aria-hidden="true">
<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="3"></rect><circle cx="9" cy="10" r="2"></circle><path d="M21 16l-5-5-9 9"></path></svg>
</span>
<span style="font-family: Sora, sans-serif; font-weight: 700; font-size: 17px; color: #12111A">Choose a photo</span>
<span style="font-size: 13px; color: #5A5770">From Photos, Files or your camera</span>
</button>
<span style="display: flex; align-items: center; gap: 6px; padding: 0 4px; font-size: 12px; color: #6E6A85">
<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"></rect><path d="M8 11V8a4 4 0 0 1 8 0v3"></path></svg>
Your photo stays on your device until you press Generate.</span>
</div>

<label for="vprompt" style="display: block; margin: 16px 16px 0 16px; border-radius: 24px; border: 1.5px solid #D9D2F5; background: #FFFFFF; box-shadow: 0 18px 36px -28px rgba(61,42,140,0.55); overflow: hidden">
<span style="position: absolute; left: -9999px">Describe the motion</span>
<textarea id="vprompt" rows="5" maxlength="2500" placeholder="Describe how it should move — the camera slowly pushes in as her hair blows in the wind…" style="display: block; width: 100%; box-sizing: border-box; border: none; outline: none; resize: none; padding: 16px 16px 8px 16px; font-family: 'Hanken Grotesk', sans-serif; font-size: 17px; line-height: 1.45; color: #12111A; background: transparent; height: 110px"></textarea>
<span style="display: flex; align-items: center; gap: 8px; padding: 8px 10px 10px 10px">
<button style="height: 34px; padding: 0 12px; border-radius: 17px; border: none; background: #EEEBFD; color: #3D2BB8; font-family: 'Hanken Grotesk', sans-serif; font-size: 13px; font-weight: 700; display: flex; align-items: center; gap: 6px">
<svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2l2.2 6.1L20.5 10l-6.3 1.9L12 18l-2.2-6.1L3.5 10l6.3-1.9z"></path></svg>
Explore prompts</button>
<button aria-label="Dictate prompt" style="width: 34px; height: 34px; border-radius: 50%; border: none; background: #F1F0F6; color: #4A4760; display: flex; align-items: center; justify-content: center">
<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"></rect><path d="M5 11a7 7 0 0 0 14 0"></path><path d="M12 18v3"></path></svg>
</button>
<span style="flex: 1"></span>
<span style="font-size: 12px; font-weight: 600; color: #6E6A85">0 / 2,500</span>
</span>
</label>

<div style="display: flex; align-items: baseline; justify-content: space-between; padding: 22px 20px 10px 20px">
<h2 style="margin: 0; font-family: Sora, sans-serif; font-weight: 700; font-size: 17px">Style</h2>
<span style="font-size: 13px; color: #5A5770">Or describe any style</span>
</div>
<div role="radiogroup" aria-label="Video style" style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; padding: 0 16px">
<sc-for list="{{styles}}" as="s" hint-placeholder-count="4">
<button role="radio" aria-checked="{{s.checked}}" style="display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 0; border: none; background: transparent; font-family: 'Hanken Grotesk', sans-serif; font-size: 13px; font-weight: {{s.weight}}; color: {{s.color}}">
<span style="position: relative; width: 100%; height: 96px; border-radius: 18px; padding: 2.5px; box-sizing: border-box; border: 2.5px solid {{s.ring}}; display: flex">
<span style="flex: 1; border-radius: 13px; background: {{s.bg}}; display: flex; align-items: flex-end; justify-content: center; padding-bottom: 6px; font-size: 10px; font-weight: 600; color: rgba(255,255,255,0.8)">[sample]</span>
<sc-if value="{{s.selected}}" hint-placeholder-val="{{ false }}"><span style="position: absolute; top: 6px; right: 6px; width: 20px; height: 20px; border-radius: 50%; background: #5B3FD8; color: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg></span></sc-if>
</span>
{{s.name}}
</button>
</sc-for>
</div>

<div style="padding: 22px 20px 10px 20px"><h2 style="margin: 0; font-family: Sora, sans-serif; font-weight: 700; font-size: 17px">Settings</h2></div>
<div style="margin: 0 16px; border-radius: 22px; border: 1px solid #ECE9F7; overflow: hidden">
<sc-for list="{{settings}}" as="r" hint-placeholder-count="3">
<a href="#" style="display: flex; align-items: center; gap: 12px; height: 56px; padding: 0 14px; border-top: {{r.divider}}; text-decoration: none; color: #12111A">
<span style="width: 32px; height: 32px; flex: none; border-radius: 9px; background: #EEEBFD; color: #3D2BB8; display: flex; align-items: center; justify-content: center" aria-hidden="true">
<sc-if value="{{r.ic.model}}" hint-placeholder-val="{{ false }}"><svg width="17" height="17" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l2.2 6.1L20.5 10l-6.3 1.9L12 18l-2.2-6.1L3.5 10l6.3-1.9z"></path></svg></sc-if>
<sc-if value="{{r.ic.clock}}" hint-placeholder-val="{{ false }}"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></svg></sc-if>
<sc-if value="{{r.ic.ratio}}" hint-placeholder-val="{{ false }}"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="18" height="12" rx="2"></rect></svg></sc-if>
</span>
<span style="flex: 1; font-size: 16px; font-weight: 600">{{r.title}}</span>
<span style="font-size: 15px; font-weight: 600; color: #5B3FD8">{{r.value}}</span>
<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#8A879C" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>
</a>
</sc-for>
</div>

<button aria-expanded="false" style="margin: 18px 16px 0 16px; width: calc(100% - 32px); height: 52px; padding: 0 14px; border-radius: 16px; border: none; background: #F7F6FB; display: flex; align-items: center; justify-content: space-between; font-family: 'Hanken Grotesk', sans-serif; font-size: 15px; font-weight: 700; color: #12111A">
Advanced settings
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#6E6A85" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg>
</button>

<div style="position: absolute; left: 0; right: 0; bottom: 0; padding: 14px 16px 30px 16px; background: rgba(255,255,255,0.82); border-top: 1px solid rgba(230,226,245,0.9); backdrop-filter: blur(24px) saturate(180%); -webkit-backdrop-filter: blur(24px) saturate(180%); display: flex; align-items: center; gap: 12px">
<span style="display: flex; flex-direction: column; gap: 1px; min-width: 92px">
<span style="font-size: 12px; font-weight: 700; color: #6E6A85">Estimated cost</span>
<span style="display: flex; align-items: center; gap: 4px; font-family: Sora, sans-serif; font-weight: 800; font-size: 18px"><svg width="14" height="14" viewBox="0 0 24 24" fill="#7B3FE4" aria-hidden="true"><path d="M12 2l2.2 6.1L20.5 10l-6.3 1.9L12 18l-2.2-6.1L3.5 10l6.3-1.9z"></path></svg>[#] credits</span>
</span>
<button style="flex: 1; height: 56px; border-radius: 28px; border: none; background: linear-gradient(90deg, #3D5AFE, #7B3FE4 60%, #C23FD1); box-shadow: 0 14px 28px -12px rgba(91,63,240,0.7), inset 0 1px 0 rgba(255,255,255,0.3); font-family: Sora, sans-serif; font-weight: 700; font-size: 17px; color: #FFFFFF; display: flex; align-items: center; justify-content: center; gap: 8px">
<svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 4l13 8-13 8z"></path></svg>
Generate video</button>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1360}}'>
class Component extends DCLogic {
renderVals() {
const styles = [
{ name: 'Realistic', bg: 'linear-gradient(170deg, #E8708A, #6A3A7A 55%, #1E1430)', selected: true },
{ name: 'Anime', bg: 'linear-gradient(170deg, #6C8CFF, #F2A65A 70%, #3D2BB8)' },
{ name: 'Cartoon', bg: 'linear-gradient(170deg, #7FB070, #3E6B3A 60%, #1E2E18)' },
{ name: '3D', bg: 'linear-gradient(170deg, #C9B39A, #5A4A3A 60%, #241C14)' }
].map((s) => ({ ...s, selected: !!s.selected, checked: s.selected ? 'true' : 'false', ring: s.selected ? '#5B3FD8' : 'transparent', weight: s.selected ? 700 : 600, color: s.selected ? '#12111A' : '#5A5770' }));
const settings = [
{ title: 'Model', value: 'Kling 3.0 Omni', ic: { model: true } },
{ title: 'Duration', value: '5 sec', ic: { clock: true } },
{ title: 'Aspect ratio', value: '16:9', ic: { ratio: true } }
].map((r, i) => ({ ...r, divider: i === 0 ? 'none' : '1px solid #F0EEF8' }));
return { styles, settings };
}
}
</script>
</body>
</html>
