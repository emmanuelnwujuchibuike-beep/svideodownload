<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Frenzsave Bubble Styles</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@600&display=swap" rel="stylesheet">
<style>
/* =========================================================
   FRENZSAVE BRAND TOKENS
   Placeholder values — swap these for the real Frenzsave
   tokens and the whole picker + Default bubble follow.
   ========================================================= */
:root {
  --fz-font: "Inter", system-ui, -apple-system, sans-serif;
  --fz-accent: #ff3d7f;                                   /* Save button, highlights */
  --fz-bubble: linear-gradient(135deg, #6c5cff 0%, #b14bff 55%, #ff3d7f 100%); /* Default sent bubble */
  --fz-bubble-fg: #ffffff;
  --fz-incoming: #f1f1f3;
  --fz-incoming-fg: #151517;
  --fz-bg: #ffffff;
  --fz-sheet: #ffffff;
  --fz-text: #111113;
  --fz-muted: #8a8a90;
  --fz-line: #ececef;
}

*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  font-family: var(--fz-font);
  background: #e9e9ee;
  color: var(--fz-text);
  -webkit-font-smoothing: antialiased;
  display: flex;
  justify-content: center;
}

.app {
  width: 100%;
  max-width: 440px;
  height: 100dvh;
  background: var(--fz-bg);
  display: flex;
  flex-direction: column;
  position: relative;
  overflow: hidden;
}
@media (min-width: 500px) {
  body { align-items: center; padding: 20px; }
  .app { height: min(900px, calc(100dvh - 40px)); border-radius: 36px; box-shadow: 0 30px 80px rgba(0,0,0,.18); }
}

/* ---------- header ---------- */
.top {
  display: grid;
  grid-template-columns: 72px 1fr 72px;
  align-items: center;
  padding: 16px 16px 8px;
}
.top button {
  background: none; border: 0; padding: 6px 0; cursor: pointer;
  font: 500 17px var(--fz-font); color: var(--fz-text);
}
.top h1 { margin: 0; text-align: center; font-size: 18px; font-weight: 700; letter-spacing: -.2px; }
.top .save { text-align: right; color: var(--fz-accent); font-weight: 600; transition: opacity .2s; }
.top .save:disabled { opacity: .35; cursor: default; }

/* ---------- live preview ---------- */
.preview {
  flex: 0 0 auto;
  padding: 26px 16px 34px;
  display: flex;
  flex-direction: column;
  gap: 30px;
  min-height: 250px;
}

.row { display: flex; }
.row.in  { justify-content: flex-start; }
.row.out { justify-content: flex-end; }

/* ---------- bottom sheet ---------- */
.sheet {
  flex: 1;
  min-height: 0;
  background: var(--fz-sheet);
  border-radius: 26px 26px 0 0;
  box-shadow: 0 -8px 30px rgba(0,0,0,.07);
  display: flex;
  flex-direction: column;
}
.handle { width: 42px; height: 5px; border-radius: 9px; background: #d4d4d9; margin: 10px auto 4px; flex: 0 0 auto; }
.sheet-scroll { overflow-y: auto; padding: 8px 14px 40px; scrollbar-width: none; }
.sheet-scroll::-webkit-scrollbar { display: none; }
.sheet h2 { font-size: 18px; font-weight: 800; margin: 14px 6px 4px; letter-spacing: -.2px; }
.sheet .note { margin: 0 6px 10px; font-size: 14px; color: var(--fz-muted); line-height: 1.4; }

.grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }

.tile {
  background: none;
  border: 2px solid transparent;
  border-radius: 20px;
  padding: 6px 4px 12px;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  align-items: center;
  font-family: var(--fz-font);
  color: var(--fz-text);
  transition: background .2s, border-color .2s, transform .15s;
}
.tile:active { transform: scale(.96); }
.tile[aria-pressed="true"] { border-color: #111; background: #f3f3f5; }
.thumb {
  height: 92px;
  width: 100%;
  display: grid;
  place-items: center;
}
.thumb .bubble { transform: scale(.8); }
.tile .label { font-size: 14px; font-weight: 500; display: flex; flex-direction: column; align-items: center; gap: 1px; line-height: 1.2; text-align: center; }
.tile .label .badge { font-size: 12.5px; color: var(--fz-muted); font-weight: 500; }
.tile.locked .label { color: var(--fz-muted); }
.tile .label svg { width: 12px; height: 12px; vertical-align: -1px; margin-right: 3px; }

.toast {
  position: absolute; left: 50%; bottom: 28px; transform: translate(-50%, 16px);
  background: #111; color: #fff; padding: 11px 18px; border-radius: 14px;
  font-size: 14px; font-weight: 600; opacity: 0; transition: .25s; pointer-events: none; z-index: 20;
  white-space: nowrap;
}
.toast.show { opacity: 1; transform: translate(-50%, 0); }

/* =========================================================
   BUBBLE — base
   ========================================================= */
.bubble {
  position: relative;
  isolation: isolate;
  max-width: 78%;
  padding: 10px 15px;
  border-radius: 22px;
  font-size: 15.5px;
  line-height: 1.38;
  overflow-wrap: anywhere;
}
.bubble.mini { width: 118px; height: 42px; padding: 0; max-width: none; }
.row.in .bubble {
  background: var(--fz-incoming);
  color: var(--fz-incoming-fg);
  border-radius: 22px 22px 22px 6px;
}
.deco { position: absolute; display: block; pointer-events: none; z-index: 2; }
.deco svg { display: block; width: 100%; height: 100%; overflow: visible; }

.pop { animation: pop .45s cubic-bezier(.2,1.4,.4,1) both; }
@keyframes pop { from { transform: scale(.85); opacity: 0; } to { transform: none; opacity: 1; } }

/* decoration motion */
.a-float   { animation: float 3s ease-in-out infinite; }
.a-bob     { animation: float 1.4s ease-in-out infinite; }
.a-sway    { animation: sway 2.6s ease-in-out infinite; transform-origin: 50% 100%; }
.a-spin    { animation: spin 12s linear infinite; }
.a-twinkle { animation: twinkle 1.8s ease-in-out infinite; }
.a-swim    { animation: swim 3.2s ease-in-out infinite; }
.a-drop    { animation: drop 2.4s ease-in-out infinite; }
.a-flap    { animation: flap .5s ease-in-out infinite alternate; }
.a-crawl   { animation: crawl 4s ease-in-out infinite; }
@keyframes float   { 50% { transform: translateY(-4px); } }
@keyframes sway    { 0%,100% { transform: rotate(-5deg); } 50% { transform: rotate(5deg); } }
@keyframes spin    { to { transform: rotate(360deg); } }
@keyframes twinkle { 0%,100% { opacity: 1; transform: scale(1); } 50% { opacity: .45; transform: scale(.75); } }
@keyframes swim    { 0%,100% { transform: translateX(0); } 50% { transform: translateX(14px); } }
@keyframes drop    { 0%,100% { transform: translateY(0); } 50% { transform: translateY(6px); } }
@keyframes flap    { to { transform: scaleY(.65) translateY(2px); } }
@keyframes crawl   { 0%,100% { transform: translateX(0) rotate(-6deg); } 50% { transform: translateX(-8px) rotate(4deg); } }
@media (prefers-reduced-motion: reduce) { .deco, .pop { animation: none !important; } }

/* =========================================================
   BUBBLE SKINS (sent messages)
   ========================================================= */

/* Default — brand */
.bubble[data-style="default"] { background: var(--fz-bubble); color: var(--fz-bubble-fg); border-radius: 22px 22px 6px 22px; }

/* Doodle — hand-drawn */
.bubble[data-style="doodle"] {
  background: #e4f8ff; color: #0b4a60; font-weight: 500;
  border: 2.5px solid #29b6e8;
  border-radius: 24px 10px 26px 12px / 12px 24px 10px 26px;
}

/* Ghosty — Halloween limited */
.bubble[data-style="ghost"] { background: #fff; color: #111; border: 2.5px solid #111; border-radius: 24px; font-weight: 600; }

/* Jack-o — Halloween limited */
.bubble[data-style="pumpkin"] {
  color: #3a1600; font-weight: 700;
  background:
    repeating-linear-gradient(90deg, rgba(120,40,0,.10) 0 2px, transparent 2px 26px),
    linear-gradient(180deg, #ffa53d, #f27510);
  border: 2.5px solid #c45800;
  border-radius: 26px 26px 22px 22px / 20px 20px 26px 26px;
}

/* Web — Halloween limited */
.bubble[data-style="web"] { background: #111; color: #fff; border-radius: 22px 22px 6px 22px; font-weight: 500; }

/* Sleepy cat */
.bubble[data-style="cat"] { background: #fff3e2; color: #4a2a0e; border: 2px solid #6b3d14; border-radius: 22px; font-weight: 500; }

/* Bunny */
.bubble[data-style="bunny"] { background: #ffe0ec; color: #7a1f45; border: 2px solid #e46a9a; border-radius: 22px; font-weight: 500; }

/* Honey bee */
.bubble[data-style="bee"] { background: #ffd23f; color: #3b2a00; border: 2px solid #e0a800; border-radius: 22px; font-weight: 600; }

/* Panda hug */
.bubble[data-style="panda"] { background: #fff; color: #1a1a1a; border: 2.5px solid #1a1a1a; border-radius: 22px; font-weight: 600; }

/* Shark */
.bubble[data-style="shark"] { background: linear-gradient(180deg, #5fb0ff, #2a6fe0); color: #fff; border-radius: 22px; font-weight: 600; }

/* Dino */
.bubble[data-style="dino"] { background: #5ccf7a; color: #0f3d1d; border: 2px solid #2e8b4c; border-radius: 22px; font-weight: 700; }
.bubble[data-style="dino"] .spikes {
  top: -9px; left: 18px; right: 18px; height: 9px;
  background: #f4c430;
  -webkit-mask: conic-gradient(from -45deg at bottom, #0000, #000 1deg 89deg, #0000 90deg) 50% / 14px 100%;
          mask: conic-gradient(from -45deg at bottom, #0000, #000 1deg 89deg, #0000 90deg) 50% / 14px 100%;
}

/* Sprout */
.bubble[data-style="sprout"] { background: #dcf6cd; color: #1f4d14; border: 2px solid #4caf50; border-radius: 22px; font-weight: 500; }

/* Sunflower */
.bubble[data-style="sunflower"] { background: #fffbe6; color: #5a3d00; border: 2px solid #ffc928; border-radius: 22px; font-weight: 500; }

/* Cloudy */
.bubble[data-style="cloud"] { background: #fff; color: #24507a; border: 2px solid #9ec9f5; border-radius: 26px; font-weight: 500; }

/* Strawberry */
.bubble[data-style="berry"] {
  color: #fff; font-weight: 700; text-shadow: 0 1px 0 rgba(120,0,20,.35);
  background:
    radial-gradient(circle, #ffe08a 1.3px, transparent 1.8px) 0 0 / 15px 13px,
    radial-gradient(circle, #ffe08a 1.3px, transparent 1.8px) 7px 6px / 15px 13px,
    #ff4d5e;
  border: 2px solid #d81b3c;
  border-radius: 22px 22px 26px 26px;
}

/* Galaxy — Pro */
.bubble[data-style="galaxy"] {
  color: #fff; font-weight: 500;
  background:
    radial-gradient(1.3px 1.3px at 14% 30%, #fff 50%, transparent 55%),
    radial-gradient(1px 1px at 42% 72%, #fff 50%, transparent 55%),
    radial-gradient(1.5px 1.5px at 78% 22%, #fff 50%, transparent 55%),
    radial-gradient(1px 1px at 63% 55%, #ffe9a8 50%, transparent 55%),
    radial-gradient(1px 1px at 28% 86%, #fff 50%, transparent 55%),
    radial-gradient(1.2px 1.2px at 90% 78%, #cfe0ff 50%, transparent 55%),
    linear-gradient(135deg, #1b0f3b 0%, #4a2a8a 55%, #2d6cdf 100%);
  border-radius: 22px 22px 6px 22px;
  box-shadow: 0 6px 18px rgba(74,42,138,.35);
}

/* Crowned — Pro */
.bubble[data-style="crown"] { background: #fff; color: #3a2c00; border: 2px solid #e9b949; border-radius: 22px; font-weight: 600; box-shadow: 0 4px 14px rgba(233,185,73,.25); }

/* Boba */
.bubble[data-style="boba"] { background: #ecd8bb; color: #4a3218; border: 2px solid #8a6238; border-radius: 22px; font-weight: 600; }

/* Pixel */
.bubble[data-style="pixel"] {
  background: none; color: #fff; padding: 11px 16px;
  font-family: "JetBrains Mono", monospace; font-size: 13.5px; font-weight: 600; border-radius: 0;
}
.bubble[data-style="pixel"]::before {
  content: ""; position: absolute; inset: 0; z-index: -1;
  background: #7b5cff;
  box-shadow: inset 0 -4px 0 #5536d6;
  clip-path: polygon(0 8px, 4px 8px, 4px 4px, 8px 4px, 8px 0, calc(100% - 8px) 0, calc(100% - 8px) 4px, calc(100% - 4px) 4px, calc(100% - 4px) 8px, 100% 8px,
                     100% calc(100% - 8px), calc(100% - 4px) calc(100% - 8px), calc(100% - 4px) calc(100% - 4px), calc(100% - 8px) calc(100% - 4px), calc(100% - 8px) 100%,
                     8px 100%, 8px calc(100% - 4px), 4px calc(100% - 4px), 4px calc(100% - 8px), 0 calc(100% - 8px));
}

/* Neon — Pro */
.bubble[data-style="neon"] {
  background: #140a22; color: #ffe1f7; font-weight: 600;
  border: 2px solid #ff4fd8; border-radius: 18px;
  box-shadow: 0 0 10px rgba(255,79,216,.6), inset 0 0 10px rgba(255,79,216,.25);
  text-shadow: 0 0 6px rgba(255,79,216,.9);
  animation: flicker 4s infinite;
}
@keyframes flicker { 0%,92%,100% { border-color: #ff4fd8; } 93% { border-color: #6a2a5c; } 95% { border-color: #ff4fd8; } 96% { border-color: #6a2a5c; } }

/* Love letter */
.bubble[data-style="letter"] {
  background: #fff0f4; color: #8a1c46; font-weight: 500;
  border: 2px solid #f06292; border-radius: 8px;
  padding-top: 28px; overflow: hidden;
}
.bubble.mini[data-style="letter"] { padding-top: 0; }
</style>
</head>
<body>

<div class="app">
  <header class="top">
    <button id="cancel" type="button">Cancel</button>
    <h1>Select bubble style</h1>
    <button id="save" class="save" type="button" disabled>Save</button>
  </header>

  <section class="preview" id="preview" aria-label="Preview"></section>

  <section class="sheet">
    <div class="handle"></div>
    <div class="sheet-scroll" id="sheet"></div>
  </section>

  <div class="toast" id="toast"></div>
</div>

<script>

   and decorations: [positionCSS, width, height, svg, animClass]

   ========================================================= */

const SECTIONS = [
  ["Suggested", "Applies to all chats. Only affects messages you send after saving."],
  ["Halloween", "Spooky season only — gone after October."],
  ["Critters",  ""],
  ["Nature",    ""],
  ["Vibes",     "Galaxy, Crowned and Neon sign come with Frenzsave Pro."]
];

const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

/* Build one bubble element for a style. Reuse this in your real chat. */
function render(styleId, text, { mini = false } = {}) {
  const s = STYLES.find(x => x.id === styleId) || STYLES[0];
  const el = document.createElement("div");
  el.className = "bubble" + (mini ? " mini" : "");
  el.dataset.style = s.id;
  const decos = s.deco.map(([pos, w, h, svg, anim = ""]) => {
    if (anim === "spikes") return `<span class="deco spikes"></span>`;
    const size = (w ? `width:${w}px;` : "") + `height:${h}px;`;
    return `<span class="deco ${anim}" style="${pos};${size}">${svg}</span>`;
  }).join("");
  el.innerHTML = (mini ? "" : `<span class="txt">${esc(text)}</span>`) + decos;
  return el;
}
window.FzBubbles = { STYLES, render };

/* =========================================================
   PICKER UI
   ========================================================= */
const LS_KEY = "fz-bubble-style";
let saved = "default";
try { saved = localStorage.getItem(LS_KEY) || "default"; } catch (e) {}
if (!STYLES.some(s => s.id === saved)) saved = "default";
let current = saved;

const preview = document.getElementById("preview");
const sheet   = document.getElementById("sheet");
const saveBtn = document.getElementById("save");

function drawPreview() {
  preview.innerHTML = "";
  const rows = [
    ["in",  "Did you see the clip I just saved? 😭"],
    ["out", "Bubble styles just dropped on Frenzsave!"],
    ["out", "Every chat gets the new look 💅"]
  ];
  rows.forEach(([dir, text]) => {
    const row = document.createElement("div");
    row.className = "row " + dir;
    const b = dir === "out" ? render(current, text) : (() => {
      const d = document.createElement("div"); d.className = "bubble"; d.textContent = text; return d;
    })();
    if (dir === "out") b.classList.add("pop");
    row.appendChild(b);
    preview.appendChild(row);
  });
}

const lockIcon = `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 10V7a5 5 0 0 1 10 0v3h1a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2v-8a2 2 0 0 1 2-2zm2 0h6V7a3 3 0 0 0-6 0z"/></svg>`;

function drawSheet() {
  SECTIONS.forEach(([section, note]) => {
    const h = document.createElement("h2");
    h.textContent = section;
    sheet.appendChild(h);
    if (note) {
      const p = document.createElement("p");
      p.className = "note";
      p.textContent = note;
      sheet.appendChild(p);
    }
    const grid = document.createElement("div");
    grid.className = "grid";
    STYLES.filter(s => s.section === section).forEach(s => {
      const t = document.createElement("button");
      t.type = "button";
      t.className = "tile" + (s.pro ? " locked" : "");
      t.dataset.id = s.id;
      const thumb = document.createElement("div");
      thumb.className = "thumb";
      thumb.appendChild(render(s.id, "", { mini: true }));
      t.appendChild(thumb);
      const label = document.createElement("div");
      label.className = "label";
      label.innerHTML = s.badge
        ? `<span class="badge">${s.badge}</span>`
        : s.pro ? `<span>${lockIcon}${esc(s.name)}</span>` : `<span>${esc(s.name)}</span>`;
      if (s.badge) label.insertAdjacentHTML("afterbegin", `<span>${esc(s.name)}</span>`);
      t.appendChild(label);
      t.addEventListener("click", () => select(s.id));
      grid.appendChild(t);
    });
    sheet.appendChild(grid);
  });
}

function syncTiles() {
  sheet.querySelectorAll(".tile").forEach(t => t.setAttribute("aria-pressed", t.dataset.id === current));
  saveBtn.disabled = current === saved;
}

function select(id) {
  if (id === current) return;
  current = id;
  drawPreview();
  syncTiles();
}

function toast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(toast._t);
  toast._t = setTimeout(() => t.classList.remove("show"), 1800);
}

saveBtn.addEventListener("click", () => {
  const s = STYLES.find(x => x.id === current);
  if (s.pro) { toast("🔒 Get Frenzsave Pro to use " + s.name); return; }
  saved = current;
  try { localStorage.setItem(LS_KEY, saved); } catch (e) {}
  syncTiles();
  toast("Bubble style saved ✨");
});

document.getElementById("cancel").addEventListener("click", () => {
  current = saved;
  drawPreview();
  syncTiles();
});

drawSheet();
drawPreview();
syncTiles();
</script>
