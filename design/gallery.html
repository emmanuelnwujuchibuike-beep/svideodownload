<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Frenz Sticker Gallery</title>
<style>
:root{--bg:#FFFFFF;--well:#F4F5F8;--ink:#101118;--sub:#4D5062;--muted:#5F6274;--accent:#4F46E5;
--brand:linear-gradient(135deg,#3B5BFD,#5B4BF3 50%,#8A3CEB);
--out:0 1px 1px rgba(16,24,40,.04),0 12px 30px -8px rgba(16,24,40,.14),0 0 0 1px rgba(16,24,40,.05);
--out-sm:0 1px 1px rgba(16,24,40,.04),0 6px 14px -4px rgba(16,24,40,.13),0 0 0 1px rgba(16,24,40,.05);
--in:inset 0 2px 6px rgba(16,24,40,.09),inset 0 0 0 1px rgba(16,24,40,.05)}
@media (prefers-color-scheme:dark){:root{--bg:#16181F;--well:#1C1F28;--ink:#F2F3F7;--sub:#B3B6C4;--muted:#9A9DAE;--accent:#8B85FF;
--out:-6px -6px 16px rgba(255,255,255,.045),9px 11px 26px rgba(0,0,0,.55);--out-sm:-4px -4px 10px rgba(255,255,255,.045),5px 6px 14px rgba(0,0,0,.55);
--in:inset 5px 5px 11px rgba(0,0,0,.55),inset -5px -5px 11px rgba(255,255,255,.045)}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:1080px;margin:0 auto;padding:40px 20px 64px}
h1{margin:0;font-size:clamp(32px,7vw,44px);font-weight:800;letter-spacing:-1.2px}
.lede{margin:8px 0 0;color:var(--sub);font-size:16px;line-height:1.5;max-width:60ch}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:24px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{height:38px;padding:0 15px;border:0;border-radius:19px;background:var(--bg);box-shadow:var(--out-sm);color:var(--sub);font:inherit;font-size:14px;font-weight:600;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--well);box-shadow:var(--in);color:var(--accent)}
.size{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:14px;color:var(--sub)}
.size select{height:38px;padding:0 12px;border:0;border-radius:12px;background:var(--well);box-shadow:var(--in);color:var(--ink);font:inherit;font-size:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:16px;margin-top:22px}
.card{display:flex;flex-direction:column;padding:14px;border-radius:24px;background:var(--bg);box-shadow:var(--out)}
.stage{position:relative;aspect-ratio:1;border-radius:18px;background:var(--well);box-shadow:var(--in);display:flex;align-items:center;justify-content:center;overflow:hidden}
.stage.checker{background-color:#fff;background-image:linear-gradient(45deg,#E9EAF0 25%,transparent 25%),linear-gradient(-45deg,#E9EAF0 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#E9EAF0 75%),linear-gradient(-45deg,transparent 75%,#E9EAF0 75%);background-size:16px 16px;background-position:0 0,0 8px,8px -8px,-8px 0}
.stage svg{width:72%;height:72%;transition:transform .35s cubic-bezier(.34,1.56,.64,1)}
.card:hover .stage svg{transform:scale(1.06) rotate(-3deg)}
.tag{position:absolute;top:10px;left:10px;height:22px;padding:0 8px;border-radius:7px;font-size:10.5px;font-weight:800;letter-spacing:.5px;display:flex;align-items:center}
.rare{color:#1D4ED8;background:#E4ECFF}.epic{color:#6D28D9;background:#EFE6FF}.legendary{color:#8A4F00;background:#FFF0D2}.currency{color:#7A4300;background:#FFF4DB}
.meta{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-top:12px}
.meta b{font-size:16px;letter-spacing:-.2px}
.meta span{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.id{font:12px ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--muted);margin-top:2px}
.dl{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.dl button{height:40px;border:0;border-radius:13px;font:inherit;font-size:14px;font-weight:650;cursor:pointer}
.dl .png{background:var(--brand);color:#fff;box-shadow:0 6px 14px rgba(79,70,229,.28)}
.dl .svg{background:var(--bg);color:var(--accent);box-shadow:var(--out-sm)}
.dl button:active{transform:translateY(1px)}
.note{margin-top:28px;font-size:13px;color:var(--muted);line-height:1.5}
:focus-visible{outline:2.5px solid var(--accent);outline-offset:3px}
</style>
</head>
<body>
<main class="wrap">
  <h1>Frenz sticker gallery</h1>
  <p class="lede">All sticker gift artwork, ready to save. Each one comes as a sharp SVG or a transparent PNG.</p>
  <div class="bar">
    <div class="chips" role="group" aria-label="Filter">
      <button class="chip" aria-pressed="true" data-f="all">All</button>
      <button class="chip" aria-pressed="false" data-f="love">Love</button>
      <button class="chip" aria-pressed="false" data-f="fun">Fun</button>
      <button class="chip" aria-pressed="false" data-f="luxe">Luxe</button>
      <button class="chip" aria-pressed="false" data-f="currency">Coin</button>
      <button class="chip" aria-pressed="false" id="checker">Show transparency</button>
    </div>
    <label class="size">PNG size
      <select id="size"><option>256</option><option selected>512</option><option>1024</option></select>
    </label>
  </div>
  <div class="grid" id="grid"></div>
  <p class="note">Prices and rarity shown are sample values. Use the real ones from your sticker system.</p>
</main>

const grid = document.getElementById('grid');
const tagName = { rare: 'RARE', epic: 'EPIC', legendary: 'LEGEND', currency: 'COIN' };
grid.innerHTML = ITEMS.map(it => `
  <article class="card" data-cat="${it.category}">
    <div class="stage">${tagName[it.rarity] ? `<span class="tag ${it.rarity}">${tagName[it.rarity]}</span>` : ''}${it.svg}</div>
    <div class="meta"><b>${it.name}</b><span>${it.price ? it.price + ' coins' : ''}</span></div>
    <div class="id">${it.id}</div>
    <div class="dl">
      <button class="png" data-id="${it.id}" data-kind="png" aria-label="Download ${it.name} as PNG">PNG</button>
      <button class="svg" data-id="${it.id}" data-kind="svg" aria-label="Download ${it.name} as SVG">SVG</button>
    </div>
  </article>`).join('');

function save(blob, name) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}
grid.addEventListener('click', async e => {
  const b = e.target.closest('button[data-id]'); if (!b) return;
  const it = ITEMS.find(x => x.id === b.dataset.id);
  if (b.dataset.kind === 'svg') return save(new Blob([it.svg], { type: 'image/svg+xml' }), it.id + '.svg');
  const size = +document.getElementById('size').value;
  const img = new Image();
  img.onload = () => {
    const c = document.createElement('canvas'); c.width = c.height = size;
    c.getContext('2d').drawImage(img, 0, 0, size, size);
    c.toBlob(bl => save(bl, `${it.id}-${size}.png`), 'image/png');
  };
  img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(it.svg.replace('width="512" height="512"', `width="${size}" height="${size}"`));
});
document.querySelectorAll('.chip[data-f]').forEach(c => c.addEventListener('click', () => {
  document.querySelectorAll('.chip[data-f]').forEach(x => x.setAttribute('aria-pressed', x === c));
  document.querySelectorAll('.card').forEach(card => card.hidden = !(c.dataset.f === 'all' || card.dataset.cat === c.dataset.f));
}));
document.getElementById('checker').addEventListener('click', e => {
  const on = e.currentTarget.getAttribute('aria-pressed') !== 'true';
  e.currentTarget.setAttribute('aria-pressed', on);
  document.querySelectorAll('.stage').forEach(s => s.classList.toggle('checker', on));
});
</script>
