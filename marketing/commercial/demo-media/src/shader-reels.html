<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;background:#000;overflow:hidden}canvas{width:100vw;height:100vh;display:block}</style></head><body><canvas id="c"></canvas>
<script>
// Procedural demo clips for the Reels scene (no third-party footage).
const q = new URLSearchParams(location.search); const which = +(q.get('s') || 0);
const c = document.getElementById('c'); c.width = innerWidth; c.height = innerHeight;
const gl = c.getContext('webgl', { preserveDrawingBuffer: true });
const V = 'attribute vec2 p;void main(){gl_Position=vec4(p,0,1);}';
const F = [
// 0 · aurora ribbons
`precision highp float;uniform vec2 r;uniform float t;
void main(){vec2 uv=gl_FragCoord.xy/r;vec2 p=(gl_FragCoord.xy-.5*r)/r.y;vec3 col=mix(vec3(.01,.02,.08),vec3(.05,.02,.15),uv.y);
for(float i=0.;i<5.;i++){float y=p.y+.25*sin(p.x*2.+t*.6+i*1.3)+.12*sin(p.x*5.-t*.9+i)-.35+i*.16;
float g=.006/abs(y)+.025*exp(-abs(y)*14.);vec3 c=mix(vec3(.15,.55,1.),vec3(.72,.28,1.),.5+.5*sin(i*1.4+t*.3+p.x));col+=g*c;}
float s=fract(sin(dot(floor(gl_FragCoord.xy/2.),vec2(12.9898,78.233)))*43758.5);col+=step(.9985,s)*(.5+.5*sin(t*3.+s*100.))*vec3(.8,.85,1.);
gl_FragColor=vec4(pow(col,vec3(.9)),1);}`,
// 1 · neon tunnel
`precision highp float;uniform vec2 r;uniform float t;
void main(){vec2 p=(gl_FragCoord.xy-.5*r)/r.y;float a=atan(p.y,p.x);float d=length(p);float z=.3/d+t*1.2;
float rings=smoothstep(.85,1.,abs(sin(z*3.14)));float spokes=smoothstep(.92,1.,abs(sin(a*6.+t*.4)));
vec3 c1=vec3(.15,.45,1.),c2=vec3(.6,.2,1.);vec3 col=mix(c1,c2,.5+.5*sin(z*.7))*(rings+spokes*.6)*smoothstep(0.,.5,d)*1.4;
col+=vec3(.25,.1,.6)*.08/d;gl_FragColor=vec4(col,1);}`,
// 2 · liquid metaballs
`precision highp float;uniform vec2 r;uniform float t;
void main(){vec2 p=(gl_FragCoord.xy-.5*r)/r.y;float f=0.;
for(float i=0.;i<7.;i++){vec2 c=vec2(.28*sin(t*.5+i*1.7),.5*cos(t*.4+i*2.3));f+=.012/dot(p-c,p-c);}
vec3 base=mix(vec3(.02,.03,.12),vec3(.12,.04,.25),gl_FragCoord.y/r.y);
float m=smoothstep(.9,1.05,f);float rim=smoothstep(.75,.9,f)-m;
vec3 lc=mix(vec3(.18,.5,1.),vec3(.75,.3,1.),.5+.5*sin(p.y*3.+t));
vec3 col=base+m*lc*(.6+.4*f/(f+1.))+rim*vec3(.9,.95,1.)*.7;gl_FragColor=vec4(col,1);}`][which];
function sh(type, src){const s=gl.createShader(type);gl.shaderSource(s,src);gl.compileShader(s);if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))console.error(gl.getShaderInfoLog(s));return s;}
const pr=gl.createProgram();gl.attachShader(pr,sh(gl.VERTEX_SHADER,V));gl.attachShader(pr,sh(gl.FRAGMENT_SHADER,F));gl.linkProgram(pr);gl.useProgram(pr);
const b=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,b);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),gl.STATIC_DRAW);
const loc=gl.getAttribLocation(pr,'p');gl.enableVertexAttribArray(loc);gl.vertexAttribPointer(loc,2,gl.FLOAT,false,0,0);
const ur=gl.getUniformLocation(pr,'r'),ut=gl.getUniformLocation(pr,'t');
window.seek=t=>{gl.uniform2f(ur,c.width,c.height);gl.uniform1f(ut,t);gl.drawArrays(gl.TRIANGLE_STRIP,0,4);};
window.seek(0);window.__ready=true;
</script></body></html>
