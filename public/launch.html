<!--
  ===========================================================================
   iOS LAUNCH SCREENS - the white screen that came BEFORE this document
  ===========================================================================
  Owner, 2026-08-23: "it still shows white on cold load entry in the pwa, i
  dont want to see white, instead the loader."

  -- Why the loader could not have covered it -------------------------------
  Everything below this comment paints only once iOS has decided to render
  THIS document. Before that, iOS shows its own launch image, and when a
  start_url carries no apple-touch-startup-image it auto-generates a plain
  WHITE one - no logo, no brand. So the real cold-entry sequence was:
  iOS white splash, THEN our loader. The white was upstream of the loader,
  in exactly the way TTFB was upstream of every in-document loader before it.

  -- Why they were missing HERE specifically --------------------------------
  These twelve tags already existed - in app/layout.tsx, added back when the
  PWA start_url was still a Next route, which inherits the root layout.
  start_url later moved to this hand-written file (see the note above), and a
  static file inherits nothing. The second fix silently undid the first for
  the one document that IS the launch target, and only for it: every other
  page kept its splash, so nothing looked broken from inside the app.

  If start_url ever moves again, these move with it. iOS reads them from the
  launch document and nowhere else.

  -- Still no render-blocking subresources ----------------------------------
  apple-touch-startup-image is never fetched in order to paint this page; iOS
  resolves it for the pre-document splash. It does not block first paint, so
  the "keep it dependency-free" rule above is intact: no stylesheet, no font,
  no script, no img src on the render path.

  Sizes mirror app/layout.tsx exactly. Each media query must match a device
  CSS width/height AND pixel ratio precisely, or iOS ignores the file and
  falls back to the white default - which is the bug being fixed here.
-->

<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<!--
  ═══════════════════════════════════════════════════════════════════════════
   THE COLD-ENTRY LOADER — the only screen that can paint before the origin
  ═══════════════════════════════════════════════════════════════════════════

  Owner, 2026-08-11: "the loader doesnt show ... make a separate premium cold
  entry loader like tiktok and X."

  ── Why every loader before this one could not have worked ────────────────
  Measured on the live site by streaming the response and timestamping each
  marker as it arrived:

      /home        TTFB 660-2280ms   stripe +17ms   complete +420ms
      /downloads   TTFB 392ms        stripe  +4ms   complete   +7ms

  The stripe and the skeletons were already in the FIRST flush, 4-17ms after
  the first byte. They were never the problem. The problem is that the first
  byte is 0.66-2.3 SECONDS away, and until it arrives the browser has no
  document, no CSS and nothing to paint. Every loader shipped so far —
  loading.tsx, the streamed skeletons, even the boot splash, which is
  server-rendered HTML — lives INSIDE that document. They are all downstream of
  the wait they were meant to cover.

  ── Why this is a hand-written file and not a Next route ──────────────────
  It was first built as app/launch/page.tsx with `force-static`. That was still
  wrong: EVERY Next route inherits the root layout, which pulls two
  render-blocking <link rel="stylesheet"> tags — so the loader would not paint
  until both global stylesheets had downloaded and parsed, putting it right back
  behind the network.

  This document has ZERO render-blocking subresources. The CSS is inline, the
  logo is a data URI, and there is no framework. One request, no dependencies,
  paints the instant the bytes land — and the service worker precaches it into
  PAGE_CACHE and serves it cache-first (public/sw/routes.js), so every launch
  after the first paints from disk with no network at all.

  ── Why it is safe to cache in a shared bucket ────────────────────────────
  It contains no user data of any kind. That is the same test "/" had to pass
  to join PAGE_CACHE_ALLOWLIST_EXACT, and it is why no personalised route may
  ever take this path.

  ── Keep it dependency-free ───────────────────────────────────────────────
  If you add a stylesheet, a font, a script tag or an <img src> to a URL, this
  stops being a cold-entry loader and becomes another thing that waits.
-->
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;background:#fff;color:#0f172a}
@media (prefers-color-scheme:dark){html,body{background:#050816;color:#e2e8f0}}
/*
  🔴 INSTALLED PWA ONLY (owner, 2026-08-11: "let the cold entry loader only be
  for the PWA take note, very important").

  Hidden by DEFAULT and revealed only in an installed display mode. Two reasons
  it is done in CSS rather than in the script below:

   • No flash. A JS check runs after the first paint, so a browser visitor would
     see the branded screen appear and then vanish — the exact "F loader showing
     in the browser" the owner ruled out in 2026-08-02.
   • It cannot fail open. If the script throws, the loader stays hidden in a
     browser rather than becoming a permanent white-and-logo screen.

  In practice a browser never reaches this file at all — it is only ever entered
  through the manifest's start_url, and nothing in the app links to it. This is
  the belt to that braces, for a bookmark or a shared link.

  All three installed modes are covered, not just `standalone`: `fullscreen` and
  `minimal-ui` are equally "installed" and a manifest change could pick either.
*/
.fx{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:26px}
@media (display-mode:standalone),(display-mode:fullscreen),(display-mode:minimal-ui){.fx{display:flex}}
.fx__mark{position:relative;width:104px;height:104px;border-radius:24%;overflow:hidden;animation:fx-rise .5s cubic-bezier(.22,1,.36,1) both}
.fx__mark img{display:block;width:100%;height:100%}
.fx__shine{position:absolute;inset:0;background:linear-gradient(115deg,transparent 42%,rgba(255,255,255,.6) 50%,transparent 58%);transform:translateX(-130%);animation:fx-shine 1.5s ease-in-out .35s infinite}
.fx__track{position:relative;width:132px;height:3px;border-radius:999px;overflow:hidden;background:rgba(99,102,241,.16);animation:fx-fade .5s ease .15s both}
.fx__bar{position:absolute;top:0;bottom:0;left:0;width:42%;border-radius:999px;background:linear-gradient(90deg,#3b82f6,#8b5cf6,#d946ef);animation:fx-sweep 1.15s cubic-bezier(.65,0,.35,1) infinite}
.fx__word{font:600 13px/1 system-ui,-apple-system,"Segoe UI",sans-serif;letter-spacing:.14em;text-transform:uppercase;opacity:.42;animation:fx-fade .5s ease .3s both}
@keyframes fx-rise{from{opacity:0;transform:translateY(10px) scale(.94)}to{opacity:1;transform:none}}
@keyframes fx-fade{from{opacity:0}to{opacity:1}}
@keyframes fx-shine{0%{transform:translateX(-130%)}100%{transform:translateX(130%)}}
@keyframes fx-sweep{0%{transform:translateX(-115%)}100%{transform:translateX(255%)}}
@media (prefers-reduced-motion:reduce){.fx__mark,.fx__shine,.fx__track,.fx__word{animation:none}.fx__bar{width:100%;opacity:.5;animation:none}}
</style>
</head>

<script>
/*
  The hand-off. Inline and at the end of <body>, so it runs the moment the
  parser reaches it — after the loader has painted, before anything else.

  location.replace, never assign: this document must not enter the history
  stack, or one back-swipe out of the app would land here and be forwarded
  straight back — a trap with no way out.

  Mode is read from the same frenz_mode cookie the edge middleware routes on,
  with the same default spelled out rather than inferred: absent means
  Downloader. Two places disagreeing about that default is exactly the
  2026-08-09 bug where a member signed in and landed in the wrong mode.

  ?next= is honoured only when it is a same-origin PATH: it must start with a
  single "/" NOT followed by another "/" or a backslash. "//evil.example" and
  "https://evil.example" are protocol-relative and absolute URLs — accepting
  either would turn this into an open redirect and make our own domain a
  jumping-off point for someone else's phishing page.
*/
(function () {
  try {
    var q = new URLSearchParams(location.search).get("next");
    var next = q && /^\/[^/\\]/.test(q) ? q : null;
    if (!next) {
      var m = document.cookie.match(/(?:^|;\s*)frenz_mode=([^;]+)/);
      next = m && decodeURIComponent(m[1]) === "full" ? "/home" : "/downloads";
    }
    /*
      🔴 NAVIGATE AFTER THE LOADER HAS PAINTED, NOT BEFORE IT.

      Owner, 2026-09-03: "the pwa still shows white for long before showing
      the F loader."

      This script is inline at the end of <body>, so it ran in the SAME task as
      the parse that produced the markup above it — before the browser had
      painted a single frame of it. location.replace() in that task means this
      document is NEVER painted: the sequence was iOS splash, then BLANK for as
      long as /downloads takes over the network, then the app own boot loader.
      The loader on this page, which exists precisely to cover that gap, was
      never on screen for it.

      A double rAF puts the navigation in the frame AFTER the first paint. The
      browser then holds that painted frame through the navigation, so the F
      mark stays continuously visible instead of blanking. It costs one frame
      (~16ms), against a blank screen that lasted as long as a cold dynamic
      route fetch.

      The setTimeout is the belt: if rAF never fires — a backgrounded launch,
      an OS that throttles the first frame — the hand-off still happens. It is
      cancelled by whichever path runs first, so this can never navigate twice.
    */
    var went = false;
    var go = function () {
      if (went) return;
      went = true;
      location.replace(next);
    };
    if (typeof requestAnimationFrame === "function") {
      requestAnimationFrame(function () {
        requestAnimationFrame(go);
      });
    }
    setTimeout(go, 250);
  } catch (e) {
    location.replace("/downloads");
  }
})();
</script>
